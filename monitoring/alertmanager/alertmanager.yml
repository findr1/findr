# Alertmanager: who gets told when an alert fires.
# For now alerts only show in Alertmanager and Grafana.
# #126 (Shina) adds the team chat webhook as a receiver here.

route:
  receiver: team-chat
  group_by: [alertname]
  group_wait: 30s       # wait a little, so related alerts arrive together
  group_interval: 5m
  repeat_interval: 4h   # remind every 4 hours while still broken

receivers:
  - name: team-chat
