[defaults]
inventory = inventory/hosts.ini
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Trust a new server the first time we connect, but refuse to connect if
# its key changes later (it could be a different machine pretending)
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
