- name: Create the app folder
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0750"

- name: Write the app settings (secrets, only root can read them)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Write the Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Log in to our private registry (ACR)
  community.docker.docker_login:
    registry_url: "{{ acr_login_server }}"
    username: 00000000-0000-0000-0000-000000000000
    password: "{{ acr_token }}"
  no_log: true
  changed_when: false   # fresh token each deploy; not a change to the server

- name: Pull the image and start the app (docker compose up -d)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: missing
    state: present

- name: Wait until the app is ready (database included)
  ansible.builtin.uri:
    url: http://localhost/api/ready
    status_code: 200
  register: ready
  retries: 12
  delay: 5
  until: ready.status == 200
