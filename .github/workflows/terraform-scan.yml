name: Terraform scan

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Lets the CD pipeline run this same scan again before it deploys
  workflow_call:

# A new push to the same branch cancels the run that is still going.
# The name is fixed because github.workflow is the caller's name when CD runs this.
concurrency:
  group: terraform-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Fails if any file isn't in the standard layout. Fix with: terraform fmt -recursive
      - name: Check the formatting
        run: terraform fmt -check -recursive -diff

      # Downloads the providers but skips the shared state, so no Azure login is needed
      - name: Set up the working folder
        run: terraform init -backend=false -input=false

      # Catches typos, wrong argument names and broken links between modules
      - name: Validate the configuration
        run: terraform validate

  checkov:
    name: Terraform scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      # Fails the job if any check fails.
      # Accepted findings are skipped in the code with a written reason.
      - name: Scan the Terraform code
        run: checkov --directory terraform --framework terraform --compact
